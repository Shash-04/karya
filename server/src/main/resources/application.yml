# ─────────────────────────────────────────────────────────────
# TaskForge — base configuration (shared across all profiles)
# Profile-specific overrides live in application-<profile>.yml
# Active profile is chosen via SPRING_PROFILES_ACTIVE (default: dev)
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: taskforge
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the mapping against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_FILE_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ── Application-specific settings (bound via @ConfigurationProperties) ──
taskforge:
  jwt:
    secret: ${JWT_SECRET}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY:900000}       # 15 min
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}  # 7 days
  queue:
    max-attempts: ${QUEUE_MAX_ATTEMPTS:3}
    retry-delay-ms: ${QUEUE_RETRY_DELAY:5000}
  ratelimit:
    auth-limit: ${RATE_LIMIT_AUTH:10}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW:60}
    task-create-limit: ${RATE_LIMIT_TASK_CREATE:30}
    task-create-window-seconds: ${RATE_LIMIT_TASK_CREATE_WINDOW:60}
  storage:
    upload-path: ${UPLOAD_PATH:./uploads}
    max-file-size: ${MAX_FILE_SIZE:10MB}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── OpenAPI / Swagger UI ──
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── Actuator (queue metrics, health) ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    ai.taskforge: INFO
